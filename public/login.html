<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - AI YouTube Shorts Studio</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .login-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 20px auto;
      box-shadow: var(--glow-cyan);
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(10, 15, 30, 0.8);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent-cyan);
      box-shadow: inset 0 0 8px rgba(56, 189, 248, 0.2);
    }
    .error-box {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">⚡</div>
    <h2 style="font-family:'Outfit'; font-size:24px; margin-bottom:6px;">Sign In to Studio</h2>
    <p style="color:var(--text-muted); font-size:13px; margin-bottom:28px;">Automated 2x Daily AI YouTube Shorts</p>

    <div id="error-box" class="error-box"></div>

    <form id="login-form" method="POST" action="/login">
      <div class="form-group">
        <label for="username">USERNAME</label>
        <input type="text" id="username" name="username" value="admin" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" name="password" value="Admin@Secure2026!" required placeholder="Enter admin password" autocomplete="current-password">
      </div>

      <div style="background:rgba(56, 189, 248, 0.08); border:1px solid rgba(56, 189, 248, 0.2); border-radius:10px; padding:12px; margin-bottom:18px; text-align:left; font-size:12px;">
        <div style="color:var(--accent-cyan); font-weight:600; margin-bottom:4px;">🔑 Default Credentials:</div>
        <div style="color:var(--text-muted); font-family:monospace; margin-bottom:8px;">Username: <strong>admin</strong><br>Password: <strong>Admin@Secure2026!</strong></div>
        <button type="button" id="btn-fill-creds" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#fff; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer;">Auto-Fill Credentials</button>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:14px; font-size:15px; margin-top:5px;">
        Access Dashboard
      </button>
    </form>
  </div>

  <script>
    function fillDemoCreds() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'Admin@Secure2026!';
    }

    async function handleLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      const errBox = document.getElementById('error-box');
      if (errBox) errBox.style.display = 'none';

      const btn = document.getElementById('btn-submit');
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'Authenticating...';
      }

      const username = (document.getElementById('username').value || '').trim();
      const password = document.getElementById('password').value || '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Login failed. Please verify credentials.');
        }

        if (data.token) {
          localStorage.setItem('auth_token', data.token);
        }

        window.location.href = '/';
      } catch (err) {
        if (errBox) {
          errBox.textContent = err.message;
          errBox.style.display = 'block';
        }
        if (btn) {
          btn.disabled = false;
          btn.innerText = 'Access Dashboard';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Check if error query param is present
      const params = new URLSearchParams(window.location.search);
      if (params.get('error')) {
        const errBox = document.getElementById('error-box');
        if (errBox) {
          errBox.textContent = params.get('error');
          errBox.style.display = 'block';
        }
      }

      const form = document.getElementById('login-form');
      if (form) form.addEventListener('submit', handleLogin);
      const fillBtn = document.getElementById('btn-fill-creds');
      if (fillBtn) fillBtn.addEventListener('click', fillDemoCreds);
    });

    window.fillDemoCreds = fillDemoCreds;
    window.handleLogin = handleLogin;
  </script>
</body>
</html>
